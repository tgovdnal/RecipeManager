services:
  app:
    build: .
    ports:
      - "3050:3050"
    environment:
      - DATABASE_URL=postgresql://silksavor:silksavor_secret@db:5432/silksavor
    volumes:
      - recipe-uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: silksavor
      POSTGRES_PASSWORD: silksavor_secret
      POSTGRES_DB: silksavor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silksavor -d silksavor"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  recipe-uploads:
